name: Website

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            apps/web/package-lock.json
            apps/site/package-lock.json

      - run: npm ci
      - run: npm ci --prefix apps/web
      - run: npm ci --prefix apps/site
      - run: npm test
      - run: npm --prefix apps/site run lint
      # The release calendar, the web app in apps/site/out/app/, and the homepage
      # with the readings pages. The calendar takes the Bible text from Hearers
      # and the psalms from Precentor.
      - run: npm run site

      - uses: actions/upload-artifact@v4
        with:
          name: site
          path: apps/site/out

  # A pull request from this repository gets a preview on Cloudflare Pages.
  preview:
    needs: build
    if: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: site
          path: out

      - name: Check for Cloudflare secrets
        id: secrets
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: echo "ready=$([ -n "$TOKEN" ] && [ -n "$ACCOUNT" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"

      - name: Check the token and the Pages project
        if: steps.secrets.outputs.ready == 'yes'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ./.github/scripts/pages-project.sh covenant-household

      - name: Deploy preview
        id: deploy
        if: steps.secrets.outputs.ready == 'yes'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: >-
            pages deploy out
            --project-name=covenant-household
            --branch=${{ github.head_ref }}
            --commit-hash=${{ github.event.pull_request.head.sha }}

      - name: Show the preview address
        run: |
          if [ '${{ steps.secrets.outputs.ready }}' = yes ]; then
            echo "Preview: ${{ steps.deploy.outputs.deployment-url }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No preview: add both CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID to the repository secrets." >> "$GITHUB_STEP_SUMMARY"
          fi
